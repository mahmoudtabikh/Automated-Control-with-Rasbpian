[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi-cable-control"
version = "0.1.0"
description = "Switch cables on Raspberry Pi GPIO pins and check IP, USB and serial interfaces."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mahmoud Tabikh" }]
dependencies = [
    "pyserial>=3.5",
    "pyusb>=1.2",
]

[project.optional-dependencies]
pi = ["RPi.GPIO>=0.7"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["cable_control"]
py-modules = ["cableControl", "checkInterfaces"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cable_control --cov=cableControl --cov=checkInterfaces --cov-report=term-missing"

[tool.coverage.run]
branch = true
